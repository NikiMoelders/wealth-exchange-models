[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-dist"
version = "0.1.0"
description = "Simulation code for wealth exchange models and heavy-tailed wealth distributions."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "jupyter",
]

[tool.setuptools.packages.find]
include = ["wealth_dist*"]
